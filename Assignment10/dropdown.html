<!DOCTYPE html>
<html>
<head>
    <title>Dropdown Test Page</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 30px;
        }
        .box {
            background: white;
            padding: 20px;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        select, ul {
            margin-top: 10px;
            width: 100%;
            padding: 8px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Select Course</h2>

    <!-- Combo Box -->
    <select id="courses">
        <option>Java</option>
        <option>Python</option>
        <option>JavaScript</option>
        <option>C++</option>
        <option>Data Science</option>
    </select>

    <!-- List -->
    <h3>Available Cities</h3>
    <ul id="cityList">
        <li>Mumbai</li>
        <li>Pune</li>
        <li>Nagpur</li>
        <li>Delhi</li>
        <li>Bangalore</li>
    </ul>
</div>

</body>
</html>
