<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: linear-gradient(to right, #141e30, #243b55);
            color: white;
        }

        header {
            background: #0d1117;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            background: #161b22;
            padding: 10px;
        }

        nav a {
            color: #58a6ff;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #1f6feb;
        }

        .container {
            padding: 30px;
        }

        .card {
            background: #1c2128;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .btn {
            padding: 10px 20px;
            background: #238636;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn:hover {
            background: #2ea043;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        img {
            width: 100%;
            border-radius: 10px;
        }

        footer {
            background: #0d1117;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    🚀 Selenium Test Page
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
</nav>

<div class="container">

    <div class="card">
        <h2>Welcome</h2>
        <p>This page contains multiple HTML elements for Selenium testing.</p>
        <button class="btn">Click Me</button>
    </div>

    <div class="card">
        <h2>Login Form</h2>
        <form>
            <label>Email:</label><br>
            <input type="email" placeholder="Enter email"><br><br>

            <label>Password:</label><br>
            <input type="password" placeholder="Enter password"><br><br>

            <input type="checkbox"> Remember Me<br><br>

            <button class="btn">Login</button>
        </form>
    </div>

    <div class="card">
        <h2>Product Gallery</h2>
        <div class="grid">
            <img src="https://via.placeholder.com/150">
            <img src="https://via.placeholder.com/150">
            <img src="https://via.placeholder.com/150">
        </div>
    </div>

    <div class="card">
        <h2>Links Section</h2>
        <a href="https://www.google.com/">Google</a><br>
        <a href="https://www.amazon.in/">Amazon</a><br>
        <a href="https://github.com/">GitHub</a>
    </div>

    <div class="card">
        <h2>Dropdown & Input</h2>
        <select>
            <option>Option 1</option>
            <option>Option 2</option>
        </select><br><br>

        <input type="text" placeholder="Type something"><br><br>

        <button class="btn">Submit</button>
    </div>

</div>

<footer>
    © 2026 Selenium Testing Page | Designed for Practical
</footer>

</body>
</html>
